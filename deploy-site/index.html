<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover 让页面能延伸到 iPhone 刘海屏底部，配合 CSS 的 safe-area 使用 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- 手机浏览器状态栏配色，和页面主色一致，看起来更像原生 App -->
    <meta name="theme-color" content="#409eff" />
    <meta name="description" content="四六级单词闯关背诵 - 手机网页版，离线可用，无需下载安装" />
    <!-- iOS 添加到主屏幕后以全屏方式打开 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="四六级单词" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <!-- 本副本仅用于 WorkBuddy 分享链接（cookie 鉴权）：manifest 需带凭据，否则被网关 403。
         此改动只存在于 deploy-site 部署副本，不进入 dist / dist.zip。
         正式托管（COS / GitHub Pages / Nginx）请用 dist.zip 的纯净版。 -->
    <link rel="manifest" href="./manifest.webmanifest" crossorigin="use-credentials" />
    <title>四六级单词闯关</title>
    <script type="module" crossorigin src="./assets/index-PQs4T31J.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BDUAz7HA.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
